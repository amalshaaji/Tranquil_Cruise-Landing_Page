# One-click deploy on Render: New + > Blueprint, pick this repo.
services:
  - type: web
    name: tranquil-cruise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tranquil-cruise-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # JSON list, e.g. ["https://your-site.vercel.app"]
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: tranquil-cruise-db
    plan: free
    databaseName: tranquil
    user: tranquil
